name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The reference types are what a Rust plugin author and a Rust host both compile against, so a
  # type that accepts a message the mechanism forbids is a wrong answer shipped to consumers.
  # This is the same gate autofuzz and veridoc run: any clippy warning in any target, including
  # tests, fails the job.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # autofuzz and veridoc both carry drifted formatting, because neither gates it. This
      # repository is the one a plugin author reads next to the specification, so it stays clean.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo publish` builds the tarball in isolation, and cargo ships only files under a package
      # root: an `include_str!` that walks above it compiles in the workspace and fails in the
      # tarball, after the version is permanent on the registry. Packaging here is the only check
      # that catches that class of mistake first.
      - name: Package
        run: cargo package --workspace --allow-dirty

      # The crate embeds the core rules from inside its own package, because cargo ships only files
      # under a package root and `spec/` is above it, while `spec/core-rules.json` stays the
      # normative file the specification names. They have to be the same bytes.
      - name: The embedded core rules are the normative ones
        run: cmp spec/core-rules.json crates/plugin-rpc/core-rules.json

      - name: Tests
        run: cargo test --workspace

  # The other half of the parity gate, for both committed schemas. A plugin author in another
  # language implements against `spec/schema/prpc-1/` and tests against the Rust types, and nothing
  # generates the schemas, because `uniqueItems` and `pattern` are beyond what the derive can emit.
  # Each pair reads one table: the envelopes read `crates/plugin-rpc/tests/messages.json` and the
  # profile spec reads `crates/plugin-rpc/tests/profile_cases.json`. The Rust half of
  # each table runs in the job above; this job asks the committed schemas the same questions.
  committed-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the committed schemas against the mechanism's verdicts
        run: |
          pip install --quiet jsonschema
          python3 scripts/check_envelope_schemas.py
          python3 scripts/check_profile_schema.py

  # crates.io will not remove a published version, only yank it, and a yanked version still
  # resolves when asked for exactly. So the tag, not a person, decides the version, and this job
  # refuses to publish when the tag and the manifest disagree. Needs the repository secret
  # CARGO_REGISTRY_TOKEN from https://crates.io/settings/tokens.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Refuse to publish when the tag and the manifest version disagree
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "plugin-rpc"))')
          if [ "$tag" != "$version" ]; then
            echo "the tag names v$tag and the manifest names $version"
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          # A re-run of a publish that already succeeded fails on "already exists" and ships nothing,
          # so the registry decides whether there is work here.
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "plugin-rpc"))')
          if curl -sf -A pluginrpc-ci "https://crates.io/api/v1/crates/plugin-rpc/${version}" -o /dev/null; then
            echo "plugin-rpc ${version} is already on the registry; nothing to publish"
          else
            cargo publish -p plugin-rpc
          fi
