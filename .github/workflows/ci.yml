name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The reference types are what a Rust plugin author and a Rust host both compile against, so a
  # type that accepts a message the mechanism forbids is a wrong answer shipped to consumers.
  # This is the same gate autofuzz and veridoc run: any clippy warning in any target, including
  # tests, fails the job.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # autofuzz and veridoc both carry drifted formatting, because neither gates it. This
      # repository is the one a plugin author reads next to the specification, so it stays clean.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The other half of the parity gate. A plugin author in another language implements against
  # `spec/schema/prpc-1/` and tests against the Rust types, and nothing generates the schemas,
  # because `uniqueItems` and `pattern` are beyond what the derive can emit. Both halves read the
  # one table at `crates/plugin-rpc/tests/messages.json`: the Rust test runs in the job above, and
  # this job asks the committed schemas the same questions.
  envelope-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the committed schemas against the mechanism's verdicts
        run: |
          pip install --quiet jsonschema
          python3 scripts/check_envelope_schemas.py

  # crates.io will not remove a published version, only yank it, and a yanked version still
  # resolves when asked for exactly. So the tag, not a person, decides the version, and this job
  # refuses to publish when the tag and the manifest disagree. Needs the repository secret
  # CARGO_REGISTRY_TOKEN from https://crates.io/settings/tokens.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Refuse to publish when the tag and the manifest version disagree
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "plugin-rpc"))')
          if [ "$tag" != "$version" ]; then
            echo "the tag names v$tag and the manifest names $version"
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p plugin-rpc
