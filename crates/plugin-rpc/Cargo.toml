[package]
name = "plugin-rpc"
description = "Reference implementation of the pluginrpc wire mechanism: line-delimited JSON-RPC framing with no profile content."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/DustinEwan/pluginrpc"
documentation = "https://docs.rs/plugin-rpc"
readme = "../../README.md"
keywords = ["json-rpc", "plugin", "ipc", "stdio"]
categories = ["api-bindings", "encoding"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true

# The claim library the harness example and the claim modules link. It is not on the registry yet, so
# the dependency names the repository; a git dependency is allowed here because it is a
# dev-dependency, which `cargo publish` does not need in order to build the library.
[dev-dependencies]
veridoc-claims = { git = "https://github.com/DustinEwan/veridoc-plugin-rust", package = "veridoc-claims" }
