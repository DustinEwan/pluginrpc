[workspace]
resolver = "2"
members = ["crates/plugin-rpc"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"

[profile.release]
overflow-checks = true
